# Dienste des Assistenten. Ollama läuft nicht in Compose.
#
# Vorerst: alles auf dem Gaming-PC (Docker Desktop), Ollama direkt auf dem Host,
#          erreichbar über host.docker.internal (Standard).
# Später:  Umzug auf den Mini-PC, dann OLLAMA_URL_DOCKER=http://<IP-des-Gaming-PCs>:11434
#          und WATCH_POLLING=false in .env. Sonst ändert sich nichts.
#
# Start: `cp .env.example .env`, anpassen, `docker compose up -d --build`.
#
#   chroma   Vektor-DB, nur im internen Netz erreichbar
#   indexer  indexiert beim Start komplett, danach nur geänderte Notizen (watchdog)
#   api      FastAPI auf Port 8080: /ask, /search, /status, /reindex, Doku unter /docs
#   nachtjob sortiert nachts die Inbox und beantwortet „Frage:“-Notizen. Startet nur mit
#            `docker compose --profile nachtjob up -d`, weil er in den Vault schreibt.
#            Auf dem Mini-PC zusätzlich `-f compose.minipc.yml` (Wake-on-LAN braucht das Host-Netz).

x-assistant: &assistant
  build: .
  image: obsidian-assistant:latest
  env_file:
    - path: .env
      required: false  # ohne .env laufen Standardwerte, z. B. für einen Testlauf
  environment:
    OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    VAULT_PATH: /vault
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
    EMBED_CACHE_PATH: /cache/embeddings.sqlite3
  volumes:
    - ${VAULT_HOST_PATH:-./demo_vault}:/vault:ro
    - cache:/cache
  extra_hosts:
    - "host.docker.internal:host-gateway"  # unter Linux nötig, Docker Desktop kennt den Namen schon
  depends_on:
    chroma:
      condition: service_healthy
  restart: unless-stopped

services:
  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  indexer:
    <<: *assistant
    command: ["assistant", "watch"]

  api:
    <<: *assistant
    command: ["assistant", "serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3

  nachtjob:
    <<: *assistant
    profiles: ["nachtjob"]
    command: ["assistant", "nightly", "dienst"]
    environment:
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      VAULT_PATH: /vault
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      EMBED_CACHE_PATH: /cache/embeddings.sqlite3
      NIGHTLY_STATE_PATH: /state
      TZ: ${TZ:-Europe/Berlin}  # Zeitfenster und Startzeit gelten in Ortszeit
    volumes:
      - ${VAULT_HOST_PATH:-./demo_vault}:/vault  # schreibend: nur 00 Inbox und Zielordner
      - cache:/cache
      - nachtjob:/state  # Läufe für Rückgängig, Pause-Schalter

volumes:
  chroma:
  cache:
  nachtjob:
