# Schweres Eval-Set für den Demo-Vault. Ergänzt eval/questions.yaml, das fast ausgereizt ist.
# Aufruf: assistant eval --fragen eval/schwer.yaml --details
# Pfade in "erwartet" sind relativ zu demo_vault/. Format wie in questions.yaml, dazu:
#   typ: ohne_antwort = der Vault beantwortet die Frage nicht, "erwartet" fehlt.
#        Zählt nicht in Treffer@k; der Eval zeigt stattdessen den besten Score
#        (mit --modus vektor --schwelle 0.5: wie viele eine Schwelle ablehnen würde).
#
# Was die Fragen schwer macht:
# - umschreibung: Synonyme, Umgangssprache, kaum ein Wort aus der Notiz; oft lockt eine
#   Nachbarnotiz mit passenden Stichwörtern (Ablenker).
# - mehrere: bis zu drei Notizen, auch über verschiedene Ordner; Treffer@5 erst, wenn alle drin sind.
# - verlinkt: die zweite Notiz teilt kaum Wörter mit der Frage, ist aber von der ersten verlinkt.
# - ohne_antwort: das Thema kommt im Vault vor, die gefragte Einzelheit nicht.

# --- Umschreibungen: Synonyme und Ablenker ---
- frage: "Wie oft wird mein Server gesichert, und wohin?"
  erwartet: "03 Wissen/Docker/Volumes und Backups.md"
  typ: umschreibung

- frage: "Was tun, wenn das Bein beim Joggen seitlich am Gelenk wehtut?"
  erwartet: "03 Wissen/Laufen/Läuferknie.md"
  typ: umschreibung

- frage: "Wie werde ich Nacktschnecken los?"
  erwartet: "03 Wissen/Garten/Schnecken abwehren.md"
  typ: umschreibung

- frage: "Was schützt das Beet von unten gegen Nager?"
  erwartet: "03 Wissen/Garten/Hochbeet anlegen.md"
  typ: umschreibung

- frage: "Wie komme ich unterwegs an meine Geräte daheim, ohne die Firewall aufzumachen?"
  erwartet: "03 Wissen/Homelab/Tailscale.md"
  typ: umschreibung

- frage: "Welche Kräuter vertragen keine Staunässe?"
  erwartet: "03 Wissen/Garten/Kräuterspirale.md"
  typ: umschreibung

- frage: "Wann brauche ich neue Treter?"
  erwartet: "03 Wissen/Laufen/Laufschuhe.md"
  typ: umschreibung

- frage: "Wie wird im Café-WLAN trotzdem Werbung gefiltert?"
  erwartet: "03 Wissen/Homelab/Tailscale.md"
  typ: umschreibung

- frage: "Wie starte ich nur den Werbeblocker neu?"
  erwartet: "03 Wissen/Docker/Compose.md"
