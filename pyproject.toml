[project]
name = "obsidian-assistant"
version = "0.4.0"
description = "Lokaler RAG-Assistent für einen Obsidian-Vault: Fragen mit Quellen, nächtliches Inbox-Sortieren, Dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Elias" }]
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
    "watchdog>=5.0",
]

[project.optional-dependencies]
# Das Dashboard läuft im Container mit dashboard/requirements.txt. Für Tests reicht dev.
dashboard = [
    "streamlit>=1.50,<2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "streamlit>=1.50,<2",
]

[project.scripts]
assistant = "assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dashboard"]
extend-exclude = [".claude/skills"]  # fremde Skills (z. B. Streamlit, Apache-2.0) unverändert lassen

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Deutsche Texte nutzen bewusst Gedankenstriche (–) und typografische Anführungszeichen.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests", "dashboard"]
extraPaths = ["src", "dashboard"]  # dashboard/: Streamlit startet app.py mit diesem Ordner im Suchpfad
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dashboard"]
addopts = "-ra"
