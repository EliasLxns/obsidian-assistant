name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (Lint)
        run: ruff check .

      - name: Ruff (Format)
        run: ruff format --check .

      - name: Pyright
        run: pyright

      - name: Pytest
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose-Datei prüfen
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f compose.minipc.yml --profile nachtjob config -q

      - name: Image bauen
        run: docker build -t obsidian-assistant:ci .

      - name: CLI im Image startet
        run: |
          docker run --rm obsidian-assistant:ci assistant --help
          docker run --rm obsidian-assistant:ci assistant nightly --help
          docker run --rm obsidian-assistant:ci git --version
          docker run --rm obsidian-assistant:ci ssh -V

      - name: Dashboard-Image bauen
        run: docker build -t obsidian-assistant-dashboard:ci dashboard

      - name: Dashboard im Image startet
        run: |
          docker run -d --name dashboard -p 8501:8501 obsidian-assistant-dashboard:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 1
          done
          docker logs dashboard
          exit 1
