# Zusatz für den Mini-PC: Der Nachtjob läuft im Netz des Hosts, damit das
# Wake-on-LAN-Paket (UDP-Broadcast) das Heimnetz erreicht.
#
#   docker compose -f docker-compose.yml -f compose.minipc.yml --profile nachtjob up -d
#
# Im Host-Netz kennt der Nachtjob den Namen „chroma“ nicht. Deshalb wird ChromaDB
# nur auf 127.0.0.1 veröffentlicht (nicht im Heimnetz sichtbar).

services:
  chroma:
    ports:
      - "127.0.0.1:8000:8000"

  nachtjob:
    network_mode: host
    environment:
      CHROMA_HOST: 127.0.0.1
